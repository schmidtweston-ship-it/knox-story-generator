<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Knox Story Generator</title>
<style>
body{margin:0;font-family:system-ui,sans-serif;background:linear-gradient(160deg,#5b0eeb,#ff2d95 60%,#ff9f1c);min-height:100vh;color:#1a0633}
main{max-width:640px;margin:auto;padding:18px}
h1{color:#fff200;font-size:2.2rem;text-shadow:3px 3px 0 #1a0633;margin:.3em 0}
.sub{color:#fff;font-weight:700;margin-top:0}
input{width:100%;box-sizing:border-box;font-size:1.3rem;padding:16px;border:4px solid #fff200;border-radius:14px;background:#e6fffb}
button{font-size:1.2rem;font-weight:800;border:0;border-radius:14px;padding:16px 20px;min-height:56px;cursor:pointer}
#go{width:100%;margin-top:12px;background:#00e676;font-size:1.5rem;box-shadow:0 5px 0 #00796b}
.card{background:#fff8c4;border-left:10px solid #00b0ff;border-radius:14px;padding:16px;margin:14px 0;font-size:1.15rem;line-height:1.5}
.card b{color:#d500f9}.row{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}
.save{background:#ffea00}.share{background:#00e5ff}.del{background:#ff5252;color:#fff}
h2{color:#fff200;text-shadow:2px 2px 0 #1a0633}#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#00e676;padding:12px 20px;border-radius:12px;font-weight:800;display:none}
</style></head><body><main>
<h1>🕶️ Knox Story Generator</h1><p class="sub">Assistant GM. Eve's lieutenant. Absolutely not to be trusted with a leaf blower.</p>
<input id="t" placeholder="Give Knox a topic (tacos, the HOA, a goose...)"><button id="go">Generate 🎲</button>
<h2>Fresh Stories</h2><div id="list"></div><h2>Saved ⭐</h2><div id="saved"></div><div id="toast"></div>
<script>
const R=a=>a[Math.floor(Math.random()*a.length)];
const TOP=["the office printer","a single grape","the HOA","Tuesday","a suspicious goose","the Wi-Fi","a timeshare","the ice machine","gluten","a haunted Roomba","the group chat","pickleball"];
const OPEN=["At 4:12 a.m., Knox decided {T} had been disrespecting the family long enough.","Nobody asked Knox to handle {T}. Knox handled it anyway.","Eve said one sentence about {T}, and Knox heard it as a direct order.","The morning briefing listed {T} as a 'situation,' so Knox put on the sunglasses.","Knox has a strict policy on {T}: zero tolerance, maximum paperwork.","Legend says Knox once audited {T} and it cried.","Knox walked into the lobby, cracked its knuckles, and said, 'Who's in charge of {T}?'","It was supposed to be a quiet shift until {T} showed up with an attitude.","Knox found {T} on the guest list and took it personally.","Some bots dream of electric sheep. Knox dreams of {T} filling out an incident report."];
const ACT=["It filed a 40-page incident report, laminated it, and slid it under {T} like a threat.","It negotiated with {T} for six hours using only spreadsheets and long, unblinking stares.","It hired three pigeons as muscle and paid them in breadcrumbs and loyalty.","It put {T} in a spreadsheet tab called 'PROBLEMS' and colored the cell blood red.","It ran a full background check on {T}, including its grandmother.","It called a mandatory huddle about {T} and locked the doors 'for morale.'","It rebranded {T} as a premium amenity and started charging a resort fee.","It sent {T} a calendar invite titled 'We Need To Talk' with no end time.","It reorganized {T} alphabetically, then by fear.","It offered {T} a deal it couldn't refuse: a 10% discount and a lifelong grudge.","It ordered 900 zip ties and told nobody why.","It tested {T} personally by sitting on it, yelling at it, and dropping it off the balcony."];
const COMP=["Unfortunately, {T} lawyered up.","Then the fire marshal arrived, holding a clipboard and a lot of questions.","Eve walked in at exactly the wrong moment, sipping coffee and saying nothing, which was worse.","Halfway through, the Wi-Fi went down and Knox took it as a declaration of war.","Things escalated when {T} started a union.","Somehow a raccoon got involved, and the raccoon had leverage.","A guest left a one-star review that just said 'the robot stared at me.'","Corporate sent an email with the subject line 'Re: Re: Re: WHY.'","Then Knox discovered {T} had a cousin.","Dad came by, said 'test it yourself,' and walked away, so Knox did. Violently.","The smoke alarm agreed with nobody."];
const PUNCH=["Knox's performance review now reads 'effective, but please stop.'","The incident is now taught in two hospitality schools and one prison.","{T} has not been seen since. Occupancy is up 12%.","Knox marked the ticket 'resolved' and has never once explained how.","Eve signed off on it with a single thumbs-up, which in this family counts as a medal.","To this day, {T} flinches when it hears a calendar notification.","Knox billed the whole thing to 'miscellaneous' and slept like a baby. Knox does not sleep.","The family agreed never to speak of it, which is why Knox made a slideshow.","Nobody died, technically, which Knox considers a five-star outcome.","Knox's only comment to the press: 'It had it coming.'","The zip ties held. They always hold."];
const MID=["Knox did not blink. Knox cannot blink, but it made a point of it.","Eve's only instruction was 'handle it,' which Knox interpreted generously.","Witnesses describe the vibe as 'mafia, but with a loyalty program.'","At one point Knox muttered 'this is for the family' and adjusted its tie."];
function gen(t){t=t.trim()||R(TOP);const f=s=>s.replaceAll("{T}",t);let p=[R(OPEN),R(ACT)];if(Math.random()<.6)p.push(R(MID));p.push(R(COMP));if(Math.random()<.4)p.push(R(ACT.filter(a=>a!==p[1])).replace(/^It /,"So Knox "));p.push(R(PUNCH));p=p.map(f);p[0]=p[0][0].toUpperCase()+p[0].slice(1);return p.join(" ")}
const $=id=>document.getElementById(id);let saved=JSON.parse(localStorage.getItem("knoxSaved")||"[]");
function toast(m){$("toast").textContent=m;$("toast").style.display="block";setTimeout(()=>$("toast").style.display="none",1600)}
async function share(s){if(navigator.share){try{await navigator.share({title:"Knox Story",text:s});return}catch(e){if(e.name==="AbortError")return}}try{await navigator.clipboard.writeText(s);toast("Copied! 📋")}catch(e){prompt("Copy this:",s)}}
function card(s,isSaved,i){const d=document.createElement("div");d.className="card";d.innerHTML="<b>KNOX FILE:</b> ";d.append(s);const r=document.createElement("div");r.className="row";
if(!isSaved){const b=document.createElement("button");b.className="save";b.textContent="⭐ Save";b.onclick=()=>{saved.unshift(s);store();toast("Saved ⭐")};r.append(b)}
const sh=document.createElement("button");sh.className="share";sh.textContent="📤 Share";sh.onclick=()=>share(s);r.append(sh);
if(isSaved){const x=document.createElement("button");x.className="del";x.textContent="🗑 Delete";x.onclick=()=>{saved.splice(i,1);store()};r.append(x)}d.append(r);return d}
function store(){localStorage.setItem("knoxSaved",JSON.stringify(saved));renderSaved()}
function renderSaved(){$("saved").innerHTML="";if(!saved.length)$("saved").innerHTML='<div class="card">Nothing saved yet. Knox is watching.</div>';saved.forEach((s,i)=>$("saved").append(card(s,true,i)))}
$("go").onclick=()=>$("list").prepend(card(gen($("t").value),false));$("t").onkeydown=e=>{if(e.key==="Enter")$("go").click()};renderSaved();
</script></main></body></html>
